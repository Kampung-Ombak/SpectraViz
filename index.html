<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Aesthetix Studio</title>
  
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#121212">
  <link rel="icon" type="image/png" href="icon-192.png">

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400;1,700&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400;1,700&family=Space+Grotesk:wght@400;600;700&family=Cinzel:wght@400;700&family=Caveat:wght@400;700&family=Outfit:wght@300;400;600;800&family=Syne:wght@400;700;800&display=swap" rel="stylesheet">
  
  <style>
    /* CSS CSS Reset & Base Variables */
    :root {
      --bg-dark: #0a0a0c;
      --panel-bg: rgba(18, 18, 22, 0.75);
      --panel-border: rgba(255, 255, 255, 0.08);
      --accent: #6366f1;
      --accent-hover: #4f46e5;
      --text-main: #f3f4f6;
      --text-muted: #9ca3af;
      --radius-lg: 16px;
      --radius-md: 10px;
      --transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: var(--bg-dark);
      font-family: 'Plus Jakarta Sans', sans-serif;
      color: var(--text-main);
    }

    #app-container {
      display: flex;
      width: 100vw;
      height: 100vh;
      position: relative;
    }

    /* Canvas Viewport Area */
    #viewport {
      flex: 1;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      background: radial-gradient(circle at center, #1a1a24 0%, #08080a 100%);
      position: relative;
      overflow: hidden;
    }

    canvas {
      box-shadow: 0 20px 50px rgba(0,0,0,0.8);
      border-radius: 4px;
      max-width: 95%;
      max-height: 95%;
      object-fit: contain;
    }

    /* Floating / Collapsible Sidebar */
    #sidebar {
      width: 360px;
      height: 100%;
      background: var(--panel-bg);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-left: 1px solid var(--panel-border);
      display: flex;
      flex-direction: column;
      z-index: 10;
      transition: var(--transition);
    }

    .sidebar-header {
      padding: 20px;
      border-bottom: 1px solid var(--panel-border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 700;
      font-size: 1.1rem;
      letter-spacing: -0.5px;
    }

    .brand i { color: var(--accent); }

    /* Navigation Tabs */
    .tabs-nav {
      display: flex;
      padding: 10px 15px;
      gap: 5px;
      background: rgba(0, 0, 0, 0.2);
      border-bottom: 1px solid var(--panel-border);
    }

    .tab-btn {
      flex: 1;
      padding: 8px 12px;
      border: none;
      background: transparent;
      color: var(--text-muted);
      font-size: 0.8rem;
      font-weight: 600;
      border-radius: var(--radius-md);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: var(--transition);
    }

    .tab-btn.active {
      background: var(--accent);
      color: #fff;
    }

    /* Tab Content Areas */
    .tab-content {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      display: none;
    }

    .tab-content.active {
      display: block;
    }

    /* Form Controls & Groups */
    .control-group {
      margin-bottom: 20px;
    }

    .control-group label {
      display: block;
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      color: var(--text-muted);
      margin-bottom: 8px;
    }

    .input-row {
      display: flex;
      gap: 10px;
      align-items: center;
    }

    input[type="text"], textarea, select {
      width: 100%;
      padding: 10px 14px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--panel-border);
      border-radius: var(--radius-md);
      color: #fff;
      font-family: inherit;
      font-size: 0.85rem;
      outline: none;
      transition: var(--transition);
    }

    input[type="text"]:focus, textarea:focus, select:focus {
      border-color: var(--accent);
      background: rgba(255, 255, 255, 0.08);
    }

    input[type="color"] {
      -webkit-appearance: none;
      border: none;
      width: 36px;
      height: 36px;
      border-radius: var(--radius-md);
      cursor: pointer;
      background: transparent;
    }

    input[type="color"]::-webkit-color-swatch-wrapper { padding: 0; }
    input[type="color"]::-webkit-color-swatch { border: 1px solid var(--panel-border); border-radius: var(--radius-md); }

    input[type="range"] {
      width: 100%;
      accent-color: var(--accent);
    }

    /* Buttons */
    .btn {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: var(--radius-md);
      background: var(--accent);
      color: white;
      font-weight: 600;
      font-size: 0.85rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: var(--transition);
    }

    .btn:hover { background: var(--accent-hover); }
    .btn-secondary { background: rgba(255, 255, 255, 0.08); }
    .btn-secondary:hover { background: rgba(255, 255, 255, 0.15); }

    /* Playlist Container */
    .playlist-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--panel-border);
      border-radius: var(--radius-md);
      margin-bottom: 8px;
      cursor: pointer;
    }

    .playlist-item.active {
      border-color: var(--accent);
      background: rgba(99, 102, 241, 0.1);
    }

    /* Bottom Player Controller Bar */
    #player-bar {
      position: absolute;
      bottom: 20px;
      left: 20px;
      right: 380px;
      background: var(--panel-bg);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--panel-border);
      border-radius: var(--radius-lg);
      padding: 12px 20px;
      display: flex;
      align-items: center;
      gap: 15px;
      z-index: 5;
    }

    .play-btn {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background: var(--accent);
      border: none;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    .progress-container {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .time-display {
      display: flex;
      justify-content: space-between;
      font-size: 0.7rem;
      color: var(--text-muted);
    }

    /* Custom Scrollbar */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.1); border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: rgba(255, 255, 255, 0.2); }
  </style>
</head>
<body>

  <div id="app-container">
    <!-- Viewport Area -->
    <div id="viewport">
      <canvas id="canvas"></canvas>

      <!-- Control Player Bawah -->
      <div id="player-bar">
        <button id="btn-play" class="play-btn">
          <i data-lucide="play"></i>
        </button>
        <div class="progress-container">
          <input type="range" id="seek-bar" value="0" min="0" max="100">
          <div class="time-display">
            <span id="time-current">00:00</span>
            <span id="time-duration">00:00</span>
          </div>
        </div>
      </div>
    </div>

    <!-- Sidebar Panel Control -->
    <div id="sidebar">
      <div class="sidebar-header">
        <div class="brand">
          <i data-lucide="sparkles"></i>
          <span>Aesthetix Studio</span>
        </div>
        <button id="btn-export" class="btn" style="width: auto; padding: 6px 12px;">
          <i data-lucide="download"></i> Export MP4
        </button>
      </div>

      <!-- Navigation Tabs -->
      <div class="tabs-nav">
        <button class="tab-btn active" data-tab="tab-media"><i data-lucide="image"></i> Media</button>
        <button class="tab-btn" data-tab="tab-lyrics"><i data-lucide="type"></i> Lirik</button>
        <button class="tab-btn" data-tab="tab-style"><i data-lucide="palette"></i> Gaya</button>
        <button class="tab-btn" data-tab="tab-export"><i data-lucide="sliders"></i> Fitur</button>
      </div>

      <!-- Tab 1: Media -->
      <div id="tab-media" class="tab-content active">
        <div class="control-group">
          <label>Aspek Rasio Canvas</label>
          <select id="aspect-ratio">
            <option value="9:16">9:16 (Story / TikTok / Reels)</option>
            <option value="1:1">1:1 (Feed Square)</option>
            <option value="16:9">16:9 (YouTube Desktop)</option>
            <option value="4:5">4:5 (Instagram Portrait)</option>
          </select>
        </div>

        <div class="control-group">
          <label>Background Image / Video</label>
          <input type="file" id="bg-upload" accept="image/*,video/*" style="display:none;">
          <button class="btn btn-secondary" onclick="document.getElementById('bg-upload').click()">
            <i data-lucide="upload"></i> Upload Media Background
          </button>
        </div>

        <div class="control-group">
          <label>Daftar Lagu (Audio)</label>
          <input type="file" id="audio-upload" accept="audio/*" multiple style="display:none;">
          <button class="btn btn-secondary" onclick="document.getElementById('audio-upload').click()">
            <i data-lucide="music"></i> Tambah Lagu
          </button>
          <div id="playlist-container" style="margin-top:10px;"></div>
        </div>
      </div>

      <!-- Tab 2: Lirik -->
      <div id="tab-lyrics" class="tab-content">
        <div class="control-group">
          <label>Mode Lirik</label>
          <select id="lyric-mode">
            <option value="lrc">LRC Auto Sync</option>
            <option value="manual">Manual Text</option>
          </select>
        </div>

        <div class="control-group">
          <label>Upload File LRC (.lrc)</label>
          <input type="file" id="lrc-upload" accept=".lrc" style="display:none;">
          <button class="btn btn-secondary" onclick="document.getElementById('lrc-upload').click()">
            <i data-lucide="file-text"></i> Import File LRC
          </button>
        </div>

        <div class="control-group">
          <label>Input Manual / Editor LRC</label>
          <textarea id="lyric-text" rows="8" placeholder="[00:12.00] Baris lirik pertama&#10;[00:15.50] Baris lirik kedua"></textarea>
        </div>
      </div>

      <!-- Tab 3: Style -->
      <div id="tab-style" class="tab-content">
        <div class="control-group">
          <label>Font Lirik</label>
          <select id="font-family">
            <option value="'Plus Jakarta Sans', sans-serif">Plus Jakarta Sans</option>
            <option value="'Playfair Display', serif">Playfair Display</option>
            <option value="'Space Grotesk', sans-serif">Space Grotesk</option>
            <option value="'Cinzel', serif">Cinzel Classic</option>
            <option value="'Caveat', cursive">Caveat Handwriting</option>
            <option value="'Outfit', sans-serif">Outfit Modern</option>
            <option value="'Syne', sans-serif">Syne Extra Bold</option>
          </select>
        </div>

        <div class="control-group">
          <label>Warna Teks & Highlight</label>
          <div class="input-row">
            <input type="color" id="color-text" value="#ffffff">
            <span style="font-size:0.8rem;">Teks Normal</span>
            <input type="color" id="color-active" value="#6366f1">
            <span style="font-size:0.8rem;">Aktif</span>
          </div>
        </div>

        <div class="control-group">
          <label>Ukuran Font</label>
          <input type="range" id="font-size" min="16" max="72" value="28">
        </div>

        <div class="control-group">
          <label>Gaya Efek Lirik</label>
          <select id="lyric-animation">
            <option value="fade">Smooth Fade</option>
            <option value="karaoke">Word Highlighting (Karaoke)</option>
            <option value="bounce">Pop Up / Bounce</option>
            <option value="slide">Slide Up</option>
          </select>
        </div>
      </div>

      <!-- Tab 4: Fitur / Visualizer -->
      <div id="tab-export" class="tab-content">
        <div class="control-group">
          <label>Efek Visualizer Audio</label>
          <select id="visualizer-type">
            <option value="none">Matikan</option>
            <option value="bars">Spectrum Bars</option>
            <option value="wave">Waveform</option>
            <option value="circle">Circular Pulse</option>
          </select>
        </div>

        <div class="control-group">
          <label>Partikel Latar Belakang</label>
          <select id="particles-effect">
            <option value="none">Tidak Ada</option>
            <option value="snow">Salju Halus</option>
            <option value="stars">Bintang Gemerlap</option>
            <option value="dust">Cinematic Dust</option>
          </select>
        </div>

        <div class="control-group">
          <label>Overlay Effect</label>
          <select id="overlay-style">
            <option value="none">Polos</option>
            <option value="vignette">Vignette Dark</option>
            <option value="grain">Film Grain Effect</option>
          </select>
        </div>
      </div>
    </div>
  </div>

  <audio id="audio"></audio>

  <!-- Panggil JavaScript Utama -->
  <script src="main.js"></script>

  <!-- Registrasi Service Worker PWA -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js')
          .then(reg => console.log('SW Registered!', reg))
          .catch(err => console.error('SW Failed!', err));
      });
    }
  </script>

  <script>
    window.lyricPos = window.lyricPos || { x: 0.5, y: 0.83 };

    document.addEventListener('DOMContentLoaded', () => {
      lucide.createIcons();

      // Handling Tab Menu
      const tabBtns = document.querySelectorAll('.tab-btn');
      const tabContents = document.querySelectorAll('.tab-content');

      tabBtns.forEach(btn => {
        btn.addEventListener('click', () => {
          tabBtns.forEach(b => b.classList.remove('active'));
          tabContents.forEach(c => c.classList.remove('active'));

          btn.classList.add('active');
          const target = btn.getAttribute('data-tab');
          document.getElementById(target).classList.add('active');
        });
      });
    });
  </script>
</body>
</html>
